<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marvel Solo TTRPG Interface</title>
<style>
  :root {
    --bg-main: #0f0f12;
    --bg-panel: #1a1a22;
    --bg-input: #111116;
    --border: #2d2d3d;
    --text-main: #f0f0f5;
    --text-muted: #8a8a9e;
    --marvel-primary: #e62429;
    --marvel-dark: #aa181c;
    --accent: #00e5ff;
    --success: #00e676;
    --danger: #ff1744;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: var(--bg-main); color: var(--text-main); padding: 12px; display: flex; justify-content: center; min-height: 100vh; }
  .wrapper { width: 100%; max-width: 900px; background-color: var(--bg-panel); border: 2px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
  
  header { background: linear-gradient(135deg, var(--marvel-primary), var(--marvel-dark)); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); }
  header h1 { font-size: 1.3rem; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; }
  .badge { background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; border: 1px solid rgba(255,255,255,0.1); }

  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 12px; }
  @media (min-width: 768px) { .grid { grid-template-columns: 1.1fr 0.9fr; } .span-all { grid-column: span 2; } }

  .box { background-color: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .box-title { font-size: 0.85rem; font-weight: bold; text-transform: uppercase; color: var(--accent); letter-spacing: 0.5px; border-bottom: 1px solid var(--border); padding-bottom: 4px; display: flex; justify-content: space-between; }

  .flex-row { display: flex; gap: 8px; width: 100%; }
  .flex-cell { flex: 1; min-width: 0; }

  label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 2px; }
  input, textarea, select { width: 100%; background-color: var(--bg-input); border: 1px solid var(--border); color: #fff; padding: 6px 10px; border-radius: 4px; font-size: 0.9rem; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }

  .hp-wrap { display: flex; align-items: center; background: var(--bg-input); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; height: 31px; }
  .hp-btn { background: rgba(255,255,255,0.05); border: none; color: #fff; width: 30px; height: 100%; font-weight: bold; cursor: pointer; }
  .hp-btn:hover { background: rgba(255,255,255,0.15); }
  .hp-val { flex: 1; text-align: center; font-weight: bold; font-size: 0.95rem; }

  .screen { font-family: monospace; background: rgba(0,0,0,0.5); border: 1px dashed var(--border); border-radius: 4px; padding: 10px; text-align: center; min-height: 64px; display: flex; flex-direction: column; justify-content: center; font-size: 1.1rem; }
  .screen-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

  button.btn { background-color: var(--marvel-primary); color: #fff; border: none; padding: 8px 12px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: background 0.1s; }
  button.btn:hover { background-color: var(--marvel-dark); }
  button.btn-sec { background-color: #313143; }
  button.btn-sec:hover { background-color: #42425a; }
  button.btn-acc { background-color: transparent; border: 1px solid var(--accent); color: var(--accent); }
  button.btn-acc:hover { background: rgba(0, 229, 255, 0.1); }

  .log-area { font-family: monospace; font-size: 0.85rem; height: 220px; line-height: 1.4; resize: vertical; background-color: #0b0b0e; color: #e0e0e6; }
</style>
</head>
<body>

<div class="wrapper">
  <header>
    <h1>Marvel Solo Sandbox</h1>
    <div class="badge">D&D 5e Combat Rule Engine</div>
  </header>

  <div class="grid">
    <!-- HERO STATS PANEL -->
    <div class="box">
      <div class="box-title">Superhero Character Sheet</div>
      <div class="flex-row">
        <div class="flex-cell" style="flex: 2;">
          <label>Hero Identity</label>
          <input type="text" id="hero-name" value="Logan (Wolverine)">
        </div>
        <div class="flex-cell" style="width: 50px; flex: 0.6;">
          <label>AC</label>
          <input type="number" id="hero-ac" value="15">
        </div>
        <div class="flex-cell" style="flex: 1.4;">
          <label>Hit Points Tracker</label>
          <div class="hp-wrap">
            <button class="hp-btn" onclick="modHP(-1)" style="color:var(--danger)">-</button>
            <div id="hero-hp" class="hp-val">15</div>
            <button class="hp-btn" onclick="modHP(1)" style="color:var(--success)">+</button>
          </div>
        </div>
      </div>
      <div class="flex-row">
        <div class="flex-cell"><label>STR</label><input type="text" id="stat-str" value="16 (+3)"></div>
        <div class="flex-cell"><label>DEX</label><input type="text" id="stat-dex" value="14 (+2)"></div>
        <div class="flex-cell"><label>CON</label><input type="text" id="stat-con" value="16 (+3)"></div>
        <div class="flex-cell"><label>WIS</label><input type="text" id="stat-wis" value="13 (+1)"></div>
      </div>
      <div class="flex-row" style="margin-top: 4px;">
        <button class="btn btn-sec flex-cell" onclick="rollFlatD20()">Pure d20 Check</button>
      </div>
    </div>

    <!-- DICE & ORACLE PANEL -->
    <div class="box">
      <div class="box-title">Fate Oracle Matrix</div>
      <div id="display-box" class="screen">
        <div>System Ready</div>
        <div class="screen-sub">Roll Oracle or combat dice options</div>
      </div>
      <div class="flex-row">
        <button class="btn flex-cell" onclick="triggerOracle()">Ask Fate Oracle (d20)</button>
      </div>
      <div class="flex-row">
        <button class="btn btn-sec flex-cell" onclick="rollGeneric(6)">d6 Damage</button>
        <button class="btn btn-sec flex-cell" onclick="rollGeneric(12)">d12 HD</button>
      </div>
    </div>

    <!-- ENEMY TRACKER PANEL -->
    <div class="box span-all">
      <div class="box-title">Active Threat Target (Combat Encounter)</div>
      <div class="flex-row">
        <div class="flex-cell" style="flex: 2;"><label>Target Hostile Name</label><input type="text" id="foe-name" value="Sentinel Drone Blueprint"></div>
        <div class="flex-cell"><label>Target AC</label><input type="number" id="foe-ac" value="13"></div>
        <div class="flex-cell"><label>Target HP</label><input type="number" id="foe-hp" value="22"></div>
      </div>
      <div class="flex-row">
        <button class="btn btn-sec flex-cell" onclick="executeAttack()">Roll Attack Matrix (+5 to Hit)</button>
        <button class="btn btn-sec flex-cell" onclick="executeDamage()">Roll Claws Damage (1d6 + 3)</button>
      </div>
    </div>

    <!-- JOURNAL LOG PANEL -->
    <div class="box span-all">
      <div class="box-title">
        <span>Adventure Journal Logs</span>
        <span id="turn-counter" style="color: var(--text-muted); font-size: 0.75rem;">Turn: 1</span>
      </div>
      <textarea id="journal-input" class="log-area" placeholder="Track your adventure narration here..."></textarea>
      <div class="flex-row">
        <button class="btn btn-acc flex-cell" onclick="exportDataState()">Backup Campaign to Disk (.txt)</button>
        <button class="btn btn-sec flex-cell" style="flex:0.4; border-color:var(--danger); color:var(--danger);" onclick="clearLogs()">Reset</button>
      </div>
    </div>
  </div>
</div>

<script>
  let health = 15;
  let turnNumber = 1;
  const disp = document.getElementById('display-box');
  const log = document.getElementById('journal-input');
  const countDisp = document.getElementById('turn-counter');

  // Initialize Starter Journal Entry
  log.value = `[SCENE 1: THE WEAPON X VAULT]\nObjective: Search the hidden base perimeter.\nTurn 1 Setup:\n- Logan approaches the exterior mechanical bay door.\n- The snow storm provides cover.\n`;

  function modHP(amt) {
    health = Math.max(0, health + amt);
    document.getElementById('hero-hp').textContent = health;
  }

  function appendJournal(msg) {
    log.value += msg + "\n";
    log.scrollTop = logArea.scrollHeight;
  }

  function checkTurnIncrement() {
    turnNumber++;
    countDisp.textContent = "Turn: " + turnNumber;
  }

  function triggerOracle() {
    const d20 = Math.floor(Math.random() * 20) + 1;
    let interpretation = "";

    // Scoping Rule: Tier 3 and 4 critical failure branches restricted safely on Turns 1 and 2
    if (turnNumber <= 2 && d20 <= 3) {
      interpretation = "No, but... (Safe Shift)";
    } else {
      if (d20 <= 3) interpretation = "No, AND... (Complication)";
      else if (d20 <= 8) interpretation = "No.";
      else if (d20 <= 11) interpretation = "No, BUT...";
      else if (d20 <= 14) interpretation = "Yes, BUT...";
      else if (d20 <= 19) interpretation = "Yes.";
      else interpretation = "Yes, AND! (Critical Edge)";
    }

    disp.innerHTML = `<div>Rolled: ${d20}</div><div class="screen-sub">${interpretation}</div>`;
    appendJournal(`> Oracle [Turn ${turnNumber}]: d20 Result ${d20} -> ${interpretation}`);
    checkTurnIncrement();
  }

  function executeAttack() {
    const raw = Math.floor(Math.random() * 20) + 1;
    const finalScore = raw + 5; 
    const targetAC = parseInt(document.getElementById('foe-ac').value) || 10;
    const target = document.getElementById('foe-name').value;
    
    let resolution = finalScore >= targetAC ? "HIT!" : "MISS.";
